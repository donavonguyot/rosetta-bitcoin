chain=testnet4
server=1
listen=1
discover=1
dnsseed=1
txindex=0
disablewallet=1
printtoconsole=1

# Local development RPC only. Do not reuse these credentials outside this
# workstation/container setup.
rpcuser=rosetta
rpcpassword=rosetta-dev-only
# Keep this node useful as a historical block source for follower ports.
prune=0

# Make the reference peer generous enough for local port development without
# turning it into an unbounded public service.
maxconnections=32

[testnet4]
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
