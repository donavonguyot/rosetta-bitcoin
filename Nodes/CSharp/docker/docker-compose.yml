services:
  csbitnode-sync-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      PEERS: ${PEERS:-${REFERENCE_P2P_PEER:?set REFERENCE_P2P_PEER from Nodes/Shared/docker/reference_topology.env}}
      HEADERS_MAX: ${HEADERS_MAX:-200}
      HEADER_BATCHES_MAX: ${HEADER_BATCHES_MAX:-1}
      BLOCKS_MAX: ${BLOCKS_MAX:-2}
      BLOCK_PREFETCH_DEPTH: ${BLOCK_PREFETCH_DEPTH:-1}
      SCRIPT_RUNNER_MODE: ${SCRIPT_RUNNER_MODE:-sequential}
      SECP256K1_BACKEND: ${SECP256K1_BACKEND:-native}
      CSBITNODE_SYNC_TIMING: ${CSBITNODE_SYNC_TIMING:-0}
      CSBITNODE_PROGRESS_JSON: ${CSBITNODE_PROGRESS_JSON:-0}
      PROGRESS_INTERVAL: ${PROGRESS_INTERVAL:-250}
    command: ["sync"]
    networks:
      - default
      - reference
    volumes:
      - csbitnode_proof_data:/data

volumes:
  csbitnode_proof_data:
    name: ${DOCKER_PROOF_VOLUME:-csbitnode_proof_data}

networks:
  reference:
    name: ${REFERENCE_DOCKER_NETWORK:?set REFERENCE_DOCKER_NETWORK from Nodes/Shared/docker/reference_topology.env}
    external: true
