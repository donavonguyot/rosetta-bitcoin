services:
  rsbitnode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
    volumes:
      - rsbitnode_data:/data
    command: ["rsbitnode", "status", "--datadir", "/data", "--runtime-surface", "docker"]

  rsbitnode-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
    volumes:
      - ${DOCKER_PROOF_VOLUME:-rsbitnode_proof_data}:/data
      - ../../../NodeCore/conformance/results:/results
    command:
      [
        "rsbitnode",
        "storage-proof",
        "--datadir",
        "/data",
        "--result-path",
        "/results/rust_storage_gate_docker.json",
        "--runtime-surface",
        "docker"
      ]

  rsbitnode-script-corpus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
    volumes:
      - ../../../NodeCore/conformance/results:/results
      - ../../../NodeCore/conformance/fixtures:/workspace/NodeCore/conformance/fixtures:ro
    command:
      [
        "rsbitnode",
        "script-corpus",
        "--manifest",
        "/workspace/NodeCore/conformance/fixtures/scripts/manifest.json",
        "--result-path",
        "/results/rust_script_corpus_docker.json",
        "--runtime-surface",
        "docker"
      ]

  rsbitnode-local-reference-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      RSBITNODE_BLOCK_PREFETCH_DEPTH: ${RSBITNODE_BLOCK_PREFETCH_DEPTH:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DOCKER_LOCAL_PROOF_VOLUME:-rsbitnode_local_reference_data}:/data
      - ../../../NodeCore/conformance/results:/results
    command:
      [
        "rsbitnode",
        "local-reference-proof",
        "--datadir",
        "/data",
        "--target",
        "${SYNC_TARGET:-10000}",
        "--rpc-url",
        "${RPC_URL:-http://host.docker.internal:48332}",
        "--rpc-user",
        "${RPC_USER:-rosetta}",
        "--rpc-password",
        "${RPC_PASSWORD:-rosetta-dev-only}",
        "--result-path",
        "/results/rust_local_reference_docker_sync.json",
        "--runtime-surface",
        "docker"
      ]

  rsbitnode-supervisor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      POLL_SEC: ${POLL_SEC:-1}
      CHECK_SEC: ${CHECK_SEC:-1}
    volumes:
      - ${DOCKER_SYNC_VOLUME:-rsbitnode_sync_data}:/data
    command: ["rsbitnode-supervisor-once"]

volumes:
  rsbitnode_data:
  rsbitnode_proof_data:
  rsbitnode_local_reference_data:
  rsbitnode_sync_data:
