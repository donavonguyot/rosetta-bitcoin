services:
  rsbitnode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
    volumes:
      - rsbitnode_data:/data
    command: ["rsbitnode", "status", "--datadir", "/data", "--runtime-surface", "docker"]

  rsbitnode-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
    volumes:
      - ${DOCKER_PROOF_VOLUME:-rsbitnode_proof_data}:/data
      - ../../Shared/conformance/results:/results
    command:
      [
        "rsbitnode",
        "storage-proof",
        "--datadir",
        "/data",
        "--result-path",
        "/results/rust_storage_gate_docker.json",
        "--runtime-surface",
        "docker"
      ]

  rsbitnode-script-corpus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
    volumes:
      - ../../Shared/conformance/results:/results
      - ../../Shared/conformance/fixtures:/workspace/Shared/conformance/fixtures:ro
    command:
      [
        "rsbitnode",
        "script-corpus",
        "--manifest",
        "/workspace/Shared/conformance/fixtures/scripts/manifest.json",
        "--result-path",
        "/results/rust_script_corpus_docker.json",
        "--runtime-surface",
        "docker"
      ]

  rsbitnode-local-reference-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      RSBITNODE_BLOCK_PREFETCH_DEPTH: ${RSBITNODE_BLOCK_PREFETCH_DEPTH:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DOCKER_LOCAL_PROOF_VOLUME:-rsbitnode_local_reference_data}:/data
      - ../../Shared/conformance/results:/results
    command:
      [
        "rsbitnode",
        "local-reference-proof",
        "--datadir",
        "/data",
        "--target",
        "${SYNC_TARGET:-5000}",
        "--byte-source",
        "p2p",
        "--peer",
        "${P2P_PEER:-host.docker.internal:48333}",
        "--result-path",
        "/results/rust_docker_baseline_5k_benchmark.json",
        "--runtime-surface",
        "docker"
      ]

  rsbitnode-supervisor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      POLL_SEC: ${POLL_SEC:-1}
      CHECK_SEC: ${CHECK_SEC:-1}
    volumes:
      - ${DOCKER_SYNC_VOLUME:-rsbitnode_sync_data}:/data
    command: ["rsbitnode-supervisor-once"]

volumes:
  rsbitnode_data:
  rsbitnode_proof_data:
  rsbitnode_10k_proof_data:
  rsbitnode_50k_proof_data:
  rsbitnode_100k_proof_data:
  rsbitnode_tuning_50k_to_100k_data:
  rsbitnode_external_5k_probe_data:
  rsbitnode_local_reference_data:
  rsbitnode_sync_data:
