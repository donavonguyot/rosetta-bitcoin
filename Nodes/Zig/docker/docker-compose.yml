services:
  zigbitnode:
    build:
      context: ../../..
      dockerfile: Nodes/Zig/docker/Dockerfile
    environment:
      ZIGBITNODE_RUNTIME_SURFACE: docker
    volumes:
      - zigbitnode_data:/data
      - ../../Shared:/workspace/Shared:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/conformance/fixtures:/workspace/Shared/conformance/fixtures:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/testing/fixtures:/workspace/Shared/testing/fixtures:ro
      - ../../Shared/conformance/results:/results
    networks:
      - default
      - reference

  zigbitnode-script-corpus:
    build:
      context: ../../..
      dockerfile: Nodes/Zig/docker/Dockerfile
    environment:
      ZIGBITNODE_RUNTIME_SURFACE: docker
    volumes:
      - ../../Shared:/workspace/Shared:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/conformance/fixtures:/workspace/Shared/conformance/fixtures:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/testing/fixtures:/workspace/Shared/testing/fixtures:ro
      - ../../Shared/conformance/results:/results

  zigbitnode-local-reference-proof:
    build:
      context: ../../..
      dockerfile: Nodes/Zig/docker/Dockerfile
    environment:
      ZIGBITNODE_RUNTIME_SURFACE: docker
    volumes:
      - zigbitnode_proof_data:/data
      - ../../Shared/conformance/results:/results
    networks:
      - default
      - reference

volumes:
  zigbitnode_data:
    name: ${DOCKER_DATA_VOLUME:-zigbitnode_data}
  zigbitnode_proof_data:
    name: ${DOCKER_PROOF_VOLUME:-zigbitnode_proof_data}
  zigbitnode_supervisor_data:
    name: ${DOCKER_SUPERVISOR_VOLUME:-zigbitnode_supervisor_data}

networks:
  reference:
    name: ${REFERENCE_DOCKER_NETWORK:?set REFERENCE_DOCKER_NETWORK from Nodes/Shared/docker/reference_topology.env}
    external: true
