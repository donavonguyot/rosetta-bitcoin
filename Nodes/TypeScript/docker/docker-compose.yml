services:
  tsbitnode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # testnet4 P2P — host must allow this port for inbound peers when LISTEN=1.
    ports:
      - "48333:48333"
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      LOG_LEVEL: info
      # Inbound P2P (same semantics as CLI --listen).
      LISTEN: "1"
    volumes:
      - tsbitnode_data:/data
    restart: unless-stopped
    # `node dist/cli/healthcheck.js`: one JSON line; `validateHealthcheckPayload`
    # requires ok/healthy/sync_status/chain/count fields/mempool_* /metrics/summary,
    # optional sync_progress_pct + last_error. Exit 1 if validation fails or
    # sync_status is "error" (Docker uses exit status, not only JSON booleans).
    healthcheck:
      test: ["CMD", "node", "dist/cli/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3

  tsbitnode-sync-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      PEERS: ${PEERS:-${REFERENCE_P2P_PEER:?set REFERENCE_P2P_PEER from Nodes/Shared/docker/reference_topology.env}}
      SECP256K1_BACKEND: ${SECP256K1_BACKEND:-native}
      PARALLEL_BLOCK_DOWNLOADS: ${PARALLEL_BLOCK_DOWNLOADS:-4}
      PAR_SCRIPT_VERIFY: ${PAR_SCRIPT_VERIFY:-1}
    volumes:
      - tsbitnode_proof_data:/data
    networks:
      - default
      - reference
    command:
      [
        "node",
        "dist/cli/storageProof.js",
        "--datadir",
        "/data",
        "--proof-path",
        "/data/typescript_storage_gate_docker.json",
        "--node-id",
        "typescriptnode-docker-rocksdb-storage"
      ]

  tsbitnode-sync-status:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      SECP256K1_BACKEND: ${SECP256K1_BACKEND:-native}
    volumes:
      - tsbitnode_sync_data:/data
    command: ["node", "dist/cli/nativeStatus.js", "--datadir", "/data"]

volumes:
  tsbitnode_data:
  tsbitnode_proof_data:
    name: ${DOCKER_PROOF_VOLUME:-tsbitnode_proof_data}
  tsbitnode_sync_data:
    name: ${DOCKER_SYNC_VOLUME:-tsbitnode_sync_data}

networks:
  reference:
    name: ${REFERENCE_DOCKER_NETWORK:?set REFERENCE_DOCKER_NETWORK from Nodes/Shared/docker/reference_topology.env}
    external: true
