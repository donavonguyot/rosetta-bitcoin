name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Smokes CLI wiring for `scripts/syncProgressReport.ts` (no `./data-ts` access).
      - run: node dist/scripts/syncProgressReport.js --help >/dev/null
      - name: Docker compose config (healthcheck wiring)
        run: docker compose -f docker/docker-compose.yml config --quiet
