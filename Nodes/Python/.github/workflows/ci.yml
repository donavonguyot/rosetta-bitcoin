name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Smokes argparse wiring for `scripts/sync_progress_report.py` (no `./data` access).
      - run: python scripts/sync_progress_report.py --help >/dev/null
      - name: Docker compose config (healthcheck wiring)
        run: docker compose -f docker/docker-compose.yml config --quiet
