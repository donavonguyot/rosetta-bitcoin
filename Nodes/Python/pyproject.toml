[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybitnode"
version = "0.1.0"
description = "Binary-compatible Bitcoin full node in Python (testnet4)"
requires-python = ">=3.12"
dependencies = [
    "coincurve==20.0.0",
    "rocksdict>=0.3.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
pybitnode = "pybitnode.node:main"
pybitnode-status = "pybitnode.chainstate_status:main"
pybitnode-db = "pybitnode.db_status:main"
pybitnode-rocksdb-proof = "pybitnode.storage.rocksdb_proof:main"
pybitnode-sync = "pybitnode.sync_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["pybitnode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
