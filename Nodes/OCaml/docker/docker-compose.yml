services:
  ocbitnode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rb/ocbitnode:foundation
    working_dir: /workspace/OCaml
    volumes:
      - ${DOCKER_LOCAL_PROOF_VOLUME:-ocbitnode_proof_data}:/data
      - ../../Shared:/workspace/Shared
    networks:
      - default
      - reference
    command: ["status", "--datadir", "/data"]

volumes:
  ocbitnode_proof_data:
  ocbitnode_5k_proof_data:
  ocbitnode_50k_proof_data:
  ocbitnode_100k_proof_data:
  ocbitnode_50k_profile_data:
  ocbitnode_21250_profile_data:

networks:
  reference:
    name: ${REFERENCE_DOCKER_NETWORK:?set REFERENCE_DOCKER_NETWORK from Nodes/Shared/docker/reference_topology.env}
    external: true
