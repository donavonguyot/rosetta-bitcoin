services:
  exbitnode-sync-proof:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      CHAIN: testnet4
      DATA_DIR: /data
      CHAINSTATE_BACKEND: rocksdb
      PEERS: ${PEERS:-bitcoin-core-testnet4:48333}
      HEADERS_MAX: ${HEADERS_MAX:-200}
      HEADER_BATCHES_MAX: ${HEADER_BATCHES_MAX:-1}
      BLOCKS_MAX: ${BLOCKS_MAX:-2}
      BLOCK_PREFETCH_DEPTH: ${BLOCK_PREFETCH_DEPTH:-0}
      SYNC_SNAPSHOT_SEC: ${SYNC_SNAPSHOT_SEC:-5}
      SYNC_SNAPSHOT_BLOCKS: ${SYNC_SNAPSHOT_BLOCKS:-0}
      SCRIPT_VERIFY_TIMEOUT_MS: ${SCRIPT_VERIFY_TIMEOUT_MS:-300000}
      SYNC_TIMING: ${SYNC_TIMING:-0}
      PAR_SCRIPT_VERIFY: ${PAR_SCRIPT_VERIFY:-0}
      PAR_SCRIPT_THREADS: ${PAR_SCRIPT_THREADS:-}
      PAR_SCRIPT_MIN_INPUTS: ${PAR_SCRIPT_MIN_INPUTS:-2}
      SECP256K1_BACKEND: ${SECP256K1_BACKEND:-native}
      RUNTIME_SURFACE: ${RUNTIME_SURFACE:-docker}
    volumes:
      - exbitnode_proof_data:/data
    networks:
      - default
      - reference

volumes:
  exbitnode_data:
    name: ${DOCKER_DATA_VOLUME:-exbitnode_data}
  exbitnode_proof_data:
    name: ${DOCKER_PROOF_VOLUME:-exbitnode_proof_data}
  exbitnode_sync_data:
    name: ${DOCKER_SYNC_VOLUME:-exbitnode_sync_data}

networks:
  reference:
    name: ${REFERENCE_DOCKER_NETWORK:-rosetta-reference-node_default}
    external: true
