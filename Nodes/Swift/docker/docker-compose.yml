services:
  swiftbitnode:
    image: ${RB_PROVENANCE_IMAGE:-rb/swift:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SWIFTBITNODE_RUNTIME_SURFACE: docker
    volumes:
      - swiftbitnode_data:/data
      - ../../Shared:/workspace/Shared:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/conformance/fixtures:/workspace/Shared/conformance/fixtures:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/testing/fixtures:/workspace/Shared/testing/fixtures:ro
      - ../../Shared/conformance/results:/results
    networks:
      - default
      - reference

  swiftbitnode-script-corpus:
    image: ${RB_PROVENANCE_IMAGE:-rb/swift:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SWIFTBITNODE_RUNTIME_SURFACE: docker
    volumes:
      - ../../Shared:/workspace/Shared:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/conformance/fixtures:/workspace/Shared/conformance/fixtures:ro
      - ${RB_FIXTURE_SHARED:-../build/fixture-package}/testing/fixtures:/workspace/Shared/testing/fixtures:ro
      - ../../Shared/conformance/results:/results

  swiftbitnode-local-reference-proof:
    image: ${RB_PROVENANCE_IMAGE:-rb/swift:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SWIFTBITNODE_RUNTIME_SURFACE: docker
    volumes:
      - swiftbitnode_proof_data:/data
      - ../../Shared/conformance/results:/results
    networks:
      - default
      - reference

volumes:
  swiftbitnode_data:
    name: ${DOCKER_DATA_VOLUME:-swiftbitnode_data}
  swiftbitnode_proof_data:
    name: ${DOCKER_PROOF_VOLUME:-swiftbitnode_proof_data}
  swiftbitnode_supervisor_data:
    name: ${DOCKER_SUPERVISOR_VOLUME:-swiftbitnode_supervisor_data}

networks:
  reference:
    name: ${REFERENCE_DOCKER_NETWORK:?set REFERENCE_DOCKER_NETWORK from Nodes/Shared/docker/reference_topology.env}
    external: true
