name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake libsqlite3-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage report (src/, report-only)
        run: |
          python3 -m venv .venv-cov
          .venv-cov/bin/pip install -q gcovr
          THRESHOLD_LINE=0 THRESHOLD_BRANCH=0 \
            BUILD_DIR=build-cov GCOVR=$PWD/.venv-cov/bin/gcovr ./scripts/coverage_report.sh

      - name: Docker compose config (healthcheck wiring)
        run: docker compose -f docker/docker-compose.yml config --quiet
